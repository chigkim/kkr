dataset: "dataset"
name: "vctk"
batch_size: 8
epochs: 10
epochs_1st: 3                      # X12: short Stage 1 A/B
epochs_2nd: 20
save_freq: 1
keep_last_checkpoints: 3
tensorboard_baseline_samples: 0
log_interval: 40
mps_empty_cache_interval: 10       # prevent WavLM/SLM MPS cache from exhausting unified memory
adversarial_segment_size: 16000    # fixed MPD/MSD crop avoids MPS graph-cache growth from variable audio lengths
slm_segment_size: 16000            # fixed WavLM perceptual crop avoids variable-shape MPSGraph cache growth
fixed_training_mel_len: true       # pin Stage 2 decoder/STFT clip length on MPS to avoid shape-cache growth
fixed_training_mel_len_frames: 96  # near-original fixed decoder crop length; MPS shape leak is mitigated by fixed padding/gather crops
fixed_mps_text_length: 512         # pin text/predictor graph width on MPS
fixed_mps_mel_length: 1152         # pin mel/attention graph width on MPS (covers VCTK max ~1060)
aligner_bucket_frames: 64          # text aligner sees mels cut to the batch's longest clip, rounded up to this; its GroupNorm otherwise normalises over the 1152-frame padding and shifts alignments (at most 18 widths on MPS)
mps_safe_gather_crop: true         # crop decoder windows via tensor gather instead of per-start strided slices
style_ref_crop_frames: 0           # 0 = no extra crop in _style_ref_input; references are still randomly cropped to 192 frames (2.4 s) by meldataset.py (max_mel_length), while extraction encodes whole utterances. Collation padding is masked inside the encoders (StyleEncoder lengths). Whether the earlier 240-frame crop (2f683fa) weakened speaker conditioning was never measured with the fixed extraction filterbank.
mps_cpu_threads: 1                 # torch CPU threads on MPS; 1, 4 and 8 timed equal on M3 Max (2.80, 2.88, 2.83 s/step at batch 8)
mps_native_lstm: false             # CPU-LSTM workaround is ~5-8% faster in Stage 2; true = keep packed LSTMs on MPS
aligner_device: "mps"             # experiment: run text aligner on MPS
wavlm_device: "mps"               # experiment: run WavLM perceptual loss on MPS
discriminator_device: "mps"       # experiment: fallback discriminator device
mpd_device: "mps"                 # experiment: run MPD on MPS
msd_device: "mps"                 # experiment: run MSD on MPS
pretrained_model: "training/kokoro_base.pth"
# Stage 2 loads first_stage_path; Stage 1 writes final_first_stage_path at the end.
# Keep final_first_stage_path separate so the final checkpoint cannot overwrite best_1st.pth.
first_stage_path: "best_1st.pth"
best_first_stage_path: "best_1st.pth"
final_first_stage_path: "first_stage.pth"
best_second_stage_path: "best_2nd.pth"
load_only_params: true
second_stage_load_pretrained: false  # false = load from first_stage_path (best_1st.pth, recommended)

data_params:
  min_length: 50                    # min phoneme sequence length (chars)
  num_workers: 2                    # CPU workers for data loading; keep low on unified-memory Macs

preprocess_params:
  sr: 24000
  spect_params:
    n_fft: 2048
    win_length: 1200
    hop_length: 300
    n_mels: 80
    fmin: 0
    fmax: 8000

model_params:
  dim_in: 64
  n_token: 178                      # phoneme vocabulary size (IPA + punctuation)
  hidden_dim: 512                   # model hidden dimension
  style_dim: 128                    # style/speaker embedding dimension (x2 = 256 total in voicepack)
  max_dur: 50                       # max duration per phoneme (in frames)
  multispeaker: true                # ENABLED: supports multiple speakers in one dataset
  n_mels: 80                        # mel spectrogram bands
  dropout: 0.2
  n_layer: 3                        # number of layers in text encoder / predictor
  text_encoder_kernel_size: 5

  decoder:
    type: istftnet                  # Kokoro uses ISTFTNet, NOT hifigan
    upsample_rates: [10, 6]
    upsample_kernel_sizes: [20, 12]
    upsample_initial_channel: 512
    resblock_kernel_sizes: [3, 7, 11]
    resblock_dilation_sizes: [[1, 3, 5], [1, 3, 5], [1, 3, 5]]
    gen_istft_n_fft: 20
    gen_istft_hop_size: 5

  # PLBERT config (phoneme-level BERT for text understanding)
  diffusion:
    embedding_mask_proba: 0.1
    transformer:
      num_layers: 3
      num_heads: 8
      head_features: 64
      multiplier: 2
    dist:
      sigma_data: 0.2
      estimate_sigma_data: true
      mean: -3.0
      std: 1.0

  plbert:
    hidden_size: 768
    num_attention_heads: 12
    intermediate_size: 2048
    max_position_embeddings: 512
    num_hidden_layers: 12
    dropout: 0.1

  # SLM discriminator (WavLM) — used in stage 2 only
  slm:
    model: "microsoft/wavlm-base-plus"
    sr: 16000
    hidden: 768
    nlayers: 13
    initial_channel: 64

# ── Loss Weights ─────────────────────────────────────────────────────────────
loss_params:
  lambda_gen: 0.0                   # X12 test arm: no generator adversarial loss (discriminators still train)
  lambda_mel: 5.0                   # mel reconstruction loss
  lambda_dur: 1.0                   # duration prediction loss
  lambda_ce: 20.0                   # duration cross-entropy loss
  lambda_F0: 1.0                    # F0 (pitch) prediction loss
  lambda_norm: 1.0                  # energy/norm prediction loss
  lambda_s2s: 1.0                   # sequence-to-sequence loss
  lambda_mono: 0.5                  # monotonic alignment loss, averaged over valid cells; upstream averages over a padded grid that is about 70% valid at batch 8 on dataset/train.txt (measured 2026-10-29), so ~0.7 would match upstream's 1.0 and 0.5 is ~30% weaker
  lambda_slm: 1.0                   # WavLM perceptual loss
  slmadv_enabled: false             # off: WavLM grad-forward in slmadv generator leaks on MPS (~2.5 GB/epoch in-section); root-causing via standalone repro
  lambda_diff: 0.0                  # diffusion loss (0 = disabled, no diffusion)
  lambda_sty: 0.0                   # style reconstruction (0 = disabled)
  lambda_timbre_spk: 0.1            # Stage 1: speaker CE loss on style_encoder timbre vector
  lambda_timbre_center: 0.01        # Stage 1: pull timbre vectors toward learned speaker centers
  lambda_prosody_spk: 0.05          # Stage 2: speaker CE loss on predictor_encoder prosody vector
  lambda_prosody_center: 0.005      # Stage 2: pull prosody vectors toward learned speaker centers
  lambda_speaker_margin: 0.01       # Push learned speaker centers apart
  speaker_center_margin: 1.0        # Margin for normalized center distance
  TMA_epoch: 0                      # start alignment from epoch 0 (fine-tuning, not training from scratch)
  diff_epoch: 999                   # effectively disable diffusion training
  joint_epoch: 3                    # start SLM joint training

optimizer_params:
  lr: 0.0001                        # main learning rate
  bert_lr: 0.00001                  # lower LR for PLBERT (mostly frozen knowledge)
  ft_lr: 0.0001                     # fine-tuning LR for acoustic modules

# ── Pitch Extractor ──────────────────────────────────────────────────────────
# StyleTTS2 uses JDC pitch extractor
F0_path: "Utils/JDC/bst.t7"

# ── ASR Alignment Model ─────────────────────────────────────────────────────
# StyleTTS2's pre-trained alignment model (English)
ASR_config: "Utils/ASR/config.yml"
ASR_path: "Utils/ASR/epoch_00080.pth"

# ── PLBERT ───────────────────────────────────────────────────────────────────
PLBERT_dir: "Utils/PLBERT/"

slmadv_params:
  min_len: 100
  max_len: 300       # lower SLM clip length to avoid MPS unified-memory pressure
  batch_percentage: 0.5
  iter: 10
  thresh: 5
  scale: 0.01
  sig: 1.5
  slm_fixed_mel_len: 40             # fixed decoder clip length for MPS-safe SLM adversarial
  slm_fixed_crop_size: 16000        # fixed WavLM adversarial audio length; 16000 matches the non-leaking perceptual-loss crop (24000 leaked in WavLM grad-forward on MPS)
  every: 8                          # run slmadv every N steps: bounds the MPS driver-memory leak (~7 MB/invocation) so a 20-epoch run fits under the watermark
  slm_conv_on_cpu: true             # run dynamic grouped-conv alignment loop on CPU for MPS
