[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "kokoro-deutsch"
version = "0.1.0"
description = "Fine-tuning Kokoro-82M for German TTS using StyleTTS2"
readme = "README.md"
authors = [
    { name="semidark" },
]
license = { file = "LICENSE" }
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent"
]
requires-python = ">=3.13"
dependencies = [
    "accelerate",
    "cython",
    "einops",
    "einops-exts",
    "espeakng-loader",
    "huggingface_hub",
    "librosa",
    "loguru",
    "matplotlib",
    "misaki[en]",
    "munch",
    "numpy",
    "pandas",
    "phonemizer",
    "pyloudnorm",
    "pyyaml",
    "scikit-learn",
    "scipy",
    "soundfile",
    "tensorboard",
    "torch",
    "torchaudio",
    "tqdm",
    "transformers",
]

[project.scripts]
kokoro = "kokoro.__main__:main"

[tool.hatch.build.targets.wheel]
only-include = ["kokoro/kokoro"]
sources = ["kokoro"]
only-packages = true

[project.urls]
Homepage = "https://github.com/semidark/kokoro-deutsch"
Repository = "https://github.com/semidark/kokoro-deutsch"
Upstream = "https://github.com/hexgrad/kokoro"
